<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c:#065367;--bg:#fff;--tx:#14262c;--mu:#6b7c82;--ln:#e3eaec;--cd:#f5f8f9}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1e;--tx:#e8f0f2;--mu:#8fa3a9;--ln:#24343a;--cd:#17262b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Anek Bangla',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
.w{max-width:720px;margin:0 auto;padding:0 14px}header{text-align:center;padding:22px 0 10px}header img{width:64px;height:64px;border-radius:16px;object-fit:cover}header h1{margin:8px 0 0;font-size:22px;font-weight:800;color:var(--c)}header p{margin:2px 0 0;color:var(--mu)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit}label{display:block;margin:10px 0 0;font-size:13px;color:var(--mu)}label input,label select{margin-top:4px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.ch button{flex:none;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit}.ch .on{background:var(--c);color:#fff;border-color:var(--c)}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pc{background:var(--cd);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--ln)}.pb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}.pn{font-weight:600}.pp{color:var(--c);font-weight:800}.ds{font-size:12px;color:var(--mu)}
button.pr{background:var(--c);color:#fff;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:600;width:100%;margin-top:auto}button.pr:disabled{opacity:.45}button.sc{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ln);display:none}
#co{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;padding:env(safe-area-inset-top) 0 40px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.tt{font-weight:800}.q{display:flex;gap:8px;align-items:center}.q button{width:30px;height:30px;border-radius:9px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font-size:16px}
.pm{display:flex;gap:8px;flex-wrap:wrap}.pm button{flex:1;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit}.pm .on{border-color:var(--c);background:var(--c);color:#fff}.nb{display:flex;align-items:center;justify-content:space-between;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:8px}.err{color:#c0392b;margin-top:10px}h3{margin:18px 0 4px}
</style></head><body><div class="w" id="app"><p style="text-align:center;padding:60px 0;color:var(--mu)">লোড হচ্ছে...</p></div><div id="bar"><div class="w"><button class="pr" onclick="open_()" id="cb"></button></div></div><div id="co"><div class="w" id="cw"></div></div>
<script>
const Q=new URLSearchParams(location.search),U=Q.get('u'),D=(Q.get('d')||'').replace(/\/$/,''),$=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=null,L=[],cart={},cat='',qs='',zone='',pm=0,mode='min';const ZN={city:'ঢাকা সিটির মধ্যে',sub:'ঢাকা সাব-আরবান',all:'ঢাকার বাইরে (সারাদেশ)'},tk=n=>'৳'+Math.round(n);
const pack=s=>{const k=P.pk;if(!k||!(s>0))return 0;const ab=k.ab||{};if(ab.l>0&&s>ab.l)return ab.a||0;const t=(k.up||[]).filter(x=>x.l>0).sort((a,b)=>a.l-b.l);for(const x of t)if(s<=x.l)return x.a||0;return t.length?(t[t.length-1].a||0):(ab.a||0)};
function items(){return Object.keys(cart).map(k=>{const[i,v]=k.split('|'),p=L.find(x=>x.i===i);if(!p)return null;const vr=(p.v||[]).find(x=>x.i===v);return{k,p,v:vr,q:cart[k],pr:vr?vr.s:p.s}}).filter(Boolean)}
const sub=()=>items().reduce((a,x)=>a+x.pr*x.q,0),kgs=()=>items().reduce((a,x)=>a+(x.p.w||0)*x.q,0);
function chg(){if(!zone)return 0;const g=Math.round((kgs()+pack(kgs()))*1000),k=Math.max(1,Math.ceil(Math.max(0,g-(P.f||0))/1000));return(P.r[zone]||0)+(k-1)*(P.x||0)}
async function init(){if(!U||!D){$('#app').innerHTML='<p style="text-align:center;padding:60px 0">লিঙ্কটি সঠিক নয়।</p>';return}
try{const r=await fetch(D+'/shop/'+encodeURIComponent(U)+'/pub.json');P=await r.json();if(!P)throw 0}catch(e){$('#app').innerHTML='<p style="text-align:center;padding:60px 0">দোকান লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।</p>';return}
L=P.p||[];P.r=P.r||{};document.documentElement.style.setProperty('--c',P.th||'#065367');document.title=P.n||'Shop';home()}
function home(){const cs=P.cats||[],f=L.map((p,i)=>[p,i]).filter(([p])=>(!cat||p.c===cat)&&(!qs||(p.n||'').toLowerCase().includes(qs)));
$('#app').innerHTML=`<header>${P.lg?`<img src="${E(P.lg)}" alt="">`:''}<h1>${E(P.n)}</h1>${P.t?`<p>${E(P.t)}</p>`:''}</header><input id="sq" placeholder="প্রোডাক্ট খুঁজুন" value="${E(qs)}" oninput="qs=this.value.toLowerCase();grid()"><div class="ch"><button class="${cat?'':'on'}" onclick="cat='';home()">সব</button>${cs.map(c=>`<button class="${cat===c?'on':''}" onclick="cat=this.dataset.c;home()" data-c="${E(c)}">${E(c)}</button>`).join('')}</div><div class="gr" id="gr"></div>`;grid();bar()}
function grid(){const f=L.map((p,i)=>[p,i]).filter(([p])=>(!cat||p.c===cat)&&(!qs||(p.n||'').toLowerCase().includes(qs)));
$('#gr').innerHTML=f.map(([p,i])=>`<div class="pc">${p.m?`<img src="${E(p.m)}" alt="" loading="lazy">`:'<div class="ph"></div>'}<div class="pb"><div class="pn">${E(p.n)}</div>${p.d?`<div class="ds">${E(p.d.slice(0,60))}</div>`:''}<div class="pp">${tk(p.s)}</div>${(p.v||[]).length?`<select id="v${i}">${p.v.map((v,j)=>`<option value="${j}"${v.a?'':' disabled'}>${E(v.n)} — ${tk(v.s)}</option>`).join('')}</select>`:''}<button class="pr" ${p.a?'':'disabled'} onclick="add(${i})">${p.a?'কার্টে যোগ করুন':'স্টক শেষ'}</button></div></div>`).join('')||'<p style="grid-column:1/3;text-align:center;color:var(--mu)">কিছু পাওয়া যায়নি</p>'}
function add(i){const p=L[i],s=$('#v'+i),v=s?p.v[+s.value]:null;if(v&&!v.a)return;const k=p.i+'|'+(v?v.i:'');cart[k]=(cart[k]||0)+1;bar()}
function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#bar').style.display=n?'block':'none';$('#cb').textContent='কার্ট দেখুন ('+n+') · '+tk(sub())}
function open_(){mode='min';$('#co').style.display='block';$('#cw').innerHTML=`<header style="padding:16px 0 4px"><h1 style="font-size:19px">আপনার অর্ডার</h1></header><div id="ci"></div><h3>আপনার তথ্য</h3><label>নাম<input id="fn" autocomplete="name"></label><label>ফোন নাম্বার<input id="fp" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" autocomplete="tel"></label><label>পূর্ণ ঠিকানা<input id="fa" autocomplete="street-address"></label><label>এলাকা<select id="fz" onchange="zone=this.value;sum()"><option value="">বাছাই করুন</option>${Object.keys(ZN).map(k=>`<option value="${k}"${zone===k?' selected':''}>${ZN[k]} — ${tk(P.r[k]||0)}</option>`).join('')}</select></label><div id="sm"></div><h3>পেমেন্ট</h3><div class="ds" style="margin-bottom:8px">কমপক্ষে ডেলিভারি চার্জ অগ্রিম দিতে হবে। চাইলে আংশিক বা পুরো টাকাও দিতে পারেন।</div><div class="pm" id="pm"></div><div id="pn"></div><label>যে নাম্বার থেকে টাকা পাঠিয়েছেন<input id="fs" type="tel" inputmode="numeric"></label><label>ট্রানজেকশন আইডি (TrxID)<input id="ft" autocapitalize="characters"></label><div class="err" id="er"></div><button class="pr" style="margin-top:14px" id="pl" onclick="place()">অর্ডার করুন</button><button class="sc" style="width:100%;margin-top:10px" onclick="close_()">← আরও কেনাকাটা</button>`;ci();sum();pay()}
function close_(){$('#co').style.display='none';bar()}
function ci(){const it=items();if(!it.length){close_();return}$('#ci').innerHTML=it.map(x=>`<div class="row"><div><div class="pn">${E(x.p.n)}${x.v?' · '+E(x.v.n):''}</div><div class="ds">${tk(x.pr)}</div></div><div class="q"><button onclick="qty('${x.k}',-1)">−</button><b>${x.q}</b><button onclick="qty('${x.k}',1)">+</button></div></div>`).join('');sum()}
function qty(k,d){cart[k]+=d;if(cart[k]<1)delete cart[k];ci()}
const adv=()=>mode==='min'?chg():mode==='full'?sub()+chg():+($('#fc')||{}).value||0;
function sum(){const el=$('#sm');if(!el)return;el.innerHTML=`<div class="nb"><span>প্রোডাক্ট</span><b>${tk(sub())}</b></div><div class="nb"><span>ডেলিভারি চার্জ</span><b>${zone?tk(chg()):'এলাকা বাছাই করুন'}</b></div><div class="nb tt"><span>মোট</span><span>${tk(sub()+chg())}</span></div>`;pay()}
function pay(){const el=$('#pm');if(!el)return;const ps=P.pay||[];if(!ps.length){el.innerHTML='<div class="err">পেমেন্ট নাম্বার সেট করা নেই।</div>';return}
el.innerHTML=ps.map((x,i)=>`<button class="${pm===i?'on':''}" onclick="pm=${i};pay()">${E(x.n)}</button>`).join('');const x=ps[pm]||ps[0],t=sub()+chg();
$('#pn').innerHTML=`<div class="nb"><span>${E(x.n)} (${E(x.t)})<br><b style="font-size:18px">${E(x.num)}</b></span><button class="sc" onclick="navigator.clipboard&&navigator.clipboard.writeText('${E(x.num)}').then(()=>this.textContent='কপি হয়েছে')">কপি</button></div><div class="pm" style="margin-top:10px"><button class="${mode==='min'?'on':''}" onclick="mode='min';pay()">শুধু ডেলিভারি<br>${zone?tk(chg()):'—'}</button><button class="${mode==='full'?'on':''}" onclick="mode='full';pay()">পুরো টাকা<br>${tk(t)}</button><button class="${mode==='custom'?'on':''}" onclick="mode='custom';pay()">অন্য অঙ্ক</button></div>${mode==='custom'?`<label>কত টাকা পাঠাবেন<input id="fc" type="number" inputmode="numeric" min="0"></label>`:''}<div class="ds" style="margin-top:8px"><b>${tk(adv())}</b> টাকা পাঠান, এরপর নিচের ঘরগুলো পূরণ করুন।</div>`}
async function place(){const g=id=>$('#'+id).value.trim(),it=items(),dc=chg(),tot=sub()+dc,a=adv(),ps=P.pay||[];let e='';
if(!it.length)e='কার্ট খালি';else if(!g('fn'))e='নাম লিখুন';else if(!/^01\d{9}$/.test(g('fp')))e='ফোন নাম্বার সঠিক নয় (১১ অঙ্ক)';else if(g('fa').length<8)e='পূর্ণ ঠিকানা লিখুন';else if(!zone)e='এলাকা বাছাই করুন';else if(!ps.length)e='পেমেন্ট নাম্বার সেট করা নেই';else if(!(a>=dc&&a<=tot))e='অগ্রিম অঙ্ক ডেলিভারি চার্জের কম বা মোট টাকার বেশি হতে পারবে না';else if(!g('fs'))e='যে নাম্বার থেকে টাকা পাঠিয়েছেন সেটি লিখুন';else if(!g('ft'))e='ট্রানজেকশন আইডি লিখুন';
$('#er').textContent=e;if(e)return;const b=$('#pl');b.disabled=true;b.textContent='পাঠানো হচ্ছে...';
try{const r=await fetch(D+'/shop/'+encodeURIComponent(U)+'/orders.json',{method:'POST',body:JSON.stringify({n:g('fn'),ph:g('fp'),ad:g('fa'),z:zone,it:it.map(x=>({i:x.p.i,v:x.v?x.v.i:'',q:x.q})),adv:a,m:(ps[pm]||ps[0]).n,s:g('fs'),t:g('ft'),at:Date.now(),tot:tot,dc:dc})});if(!r.ok)throw 0;cart={};
$('#cw').innerHTML=`<header style="padding:60px 0"><h1>ধন্যবাদ!</h1><p>আপনার অর্ডার পাঠানো হয়েছে। পেমেন্ট যাচাই করে আমরা কনফার্ম করব।</p></header><button class="pr" onclick="close_();home()">ঠিক আছে</button>`}catch(x){$('#er').textContent='অর্ডার পাঠানো যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।';b.disabled=false;b.textContent='অর্ডার করুন'}}
init();
</script></body></html>
